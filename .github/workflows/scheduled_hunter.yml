name: Scheduled Story Hunter

on:
  schedule:
    # 매일 자정 및 정오 (한국 시간 09:00, 21:00) 정기 자동 실행
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 관리자가 원할 때 수동 실행도 가능

jobs:
  discover_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Story Hunter Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python scheduled_job.py

      - name: Commit and Push Updated Queue
        run: |
          git config --global user.name "StoryHunter-Bot"
          git config --global user.email "bot@storyhunter.cloud"
          git add storage/discovered_queue.json storage/discovered_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update discovered works queue [skip ci]" && git push)
