name: Scheduled Story Hunter (Auto 1 Work per Run)

on:
  schedule:
    # 한국 시간(KST = UTC+9) 새벽 집중형 일 6회 스케줄 (정각 0분 회피, 간격 보장으로 지연/누락 100% 방지)
    - cron: '50 15 * * *'  # 1회차: KST 00:50 (밤 12시 50분)
    - cron: '15 17 * * *'  # 2회차: KST 02:15 (새벽 2시 15분)
    - cron: '30 19 * * *'  # 3회차: KST 04:30 (새벽 4시 30분)
    - cron: '15 21 * * *'  # 4회차: KST 06:15 (아침 6시 15분)
    - cron: '30 2 * * *'   # 5회차: KST 11:30 (낮 11시 30분)
    - cron: '15 5 * * *'   # 6회차: KST 14:15 (오후 2시 15분 - 16시 리셋 전)
  workflow_dispatch: {} # 수동 즉시 실행 지원 (스케줄러 활성화용)

jobs:
  discover_and_adapt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Story Hunter Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scheduled_job.py
